# Multiverse-Inventories 5.3.x — keep inventory separation for everyone, including
# admins with `*`. When enable-bypass-permissions is true, `mvinv.bypass.*` (covered
# by admin `*`) skips the inventory swap. Leave it false.
#
# The `mvinv.bypass.gamemode.*` node is gated by the same setting, so admin `*`
# doesn't trigger it either. Gamemode itself is forced by Multiverse-Core for
# everyone: admin gets explicit `mv.bypass.gamemode.*` false nodes
# (scripts/luckperms/groups.lp). See DEPLOY.md.
share-handling:
  enable-bypass-permissions: false
  enable-gamemode-share-handling: false
  default-ungrouped-worlds: false
