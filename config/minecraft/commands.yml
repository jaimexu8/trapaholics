# Bukkit command aliases:
#   /spawn    -> teleports to the spawn of the player's current world (/mv spawn)
#   /survival -> last spot anywhere in group `survival` (overworld, nether or end)
#   /creative -> last spot in `creative`
# Needs multiverse.core.spawn.self.<world> for /spawn and
# share-handling.active-optional-shares: [last_location] in
# plugins/Multiverse-Inventories/config.yml with multiverse.teleport.self.ll.<world>
# for /survival and /creative (scripts/luckperms/groups.lp). Applied via itzg config sync on start.
command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  spawn:
    - "mv spawn"
  survival:
    - "mv tp ll:survival"
  creative:
    - "mv tp ll:creative"
