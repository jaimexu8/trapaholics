# Copied to minecraft/creative/paper-world.yml by scripts/luckperms/setup.sh
# after the creative world is created. Tightens entity / redstone / hopper load
# so creative builds cannot drag down the shared main thread (ARCHITECTURE §5.6).
_version: 31
chunks:
  auto-save-interval: 6000
entities:
  spawns:
    spawn-limits:
      ambient: 1
      axolotls: 1
      creature: 5
      monster: 5
      underground_water_creature: 1
      water_ambient: 1
      water_creature: 1
  behavior:
    spawner-nerf-nerfed-mobs: true
misc:
  redstone-implementation: ALTERNATE_CURRENT
hoppers:
  disable-move-event: true
  hopper-transfer-cooldown: 16
  hopper-amount: 1
tick-rates:
  container-update: 2
  grass-spread: 4
  mob-spawner: 4
