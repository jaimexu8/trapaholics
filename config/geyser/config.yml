# Geyser Standalone — Bedrock → Paper (ARCHITECTURE.md §5.7).
# Seed into ./geyser/config.yml on first deploy (see DEPLOY.md step 6).
# Keys verified against Geyser 2.12.1-b1307 (config-version 12).
#
# NetherNet is the ONLY Bedrock transport (Bedrock 26.60+ no longer connects over
# RakNet). Signaling is provided by playit (NXS): Geyser registers with
# nethernet.playit.gg and playit's "Minecraft Bedrock → Geyser or WaterdogPE"
# tunnel (agent 1.2.0) carries only the UDP NetherNet game traffic to this
# container's fixed compose IP 172.28.10.10:19133 (DEPLOY.md step 9).
# Geyser connects to Paper at hostname `minecraft:25565` with PROXY protocol.
#
# The NXS token is a secret and is NOT stored here: put it in .env as
# GEYSER_NXS_TOKEN; scripts/geyser/entrypoint.sh writes it into
# bedrock.signaling.nxs.token of ./geyser/config.yml on every container start.

bedrock:
  address: 0.0.0.0
  # Port players connect to on the playit tunnel hostname (advertised by NXS).
  port: 19132
  # NetherNet game traffic (UDP); the playit tunnel targets 172.28.10.10:19133.
  webrtc-port: 19133
  # nethernet only; RakNet (old clients) is deliberately not offered.
  transport: nethernet
  signaling:
    # playit provides signaling; no built-in TCP signaling listener.
    mode: nxs
    # No advertise-addresses / STUN: the NXS service handles addressing.
    advertise-addresses: []
    stun-discovery: false
    builtin:
      https:
        certificate: ''
        private-key: ''
        password: ''
    nxs:
      # Filled from GEYSER_NXS_TOKEN (.env) by scripts/geyser/entrypoint.sh.
      # Leave empty here; never commit the real token.
      token: ''
      endpoint: https://nethernet.playit.gg

java:
  # Compose DNS name on the `mc` network (geyser is NOT in minecraft's netns).
  address: minecraft
  port: 25565
  auth-type: floodgate
  forward-hostname: false

motd:
  primary-motd: trapaholics
  secondary-motd: Java + Bedrock
  passthrough-motd: true
  max-players: 100
  passthrough-player-counts: true
  ping-passthrough-interval: 3

gameplay:
  server-name: trapaholics
  cooldown-type: crosshair
  command-suggestions: true
  show-coordinates: true
  disable-bedrock-scaffolding: false
  nether-roof-workaround: false
  emotes-enabled: true
  block-legacy-codes: true
  unusable-space-block: minecraft:barrier
  enable-custom-content: true
  force-resource-packs: true
  enable-integrated-pack: true
  forward-player-ping: false
  xbox-achievements-enabled: false
  max-visible-custom-skulls: 128
  custom-skull-render-distance: 32

default-locale: system
log-player-ip-addresses: true
saved-user-logins: []
pending-authentication-timeout: 120
notify-on-new-bedrock-update: true

advanced:
  cache-images: 0
  scoreboard-packet-threshold: 20
  add-team-suggestions: true
  resource-pack-urls: []
  floodgate-key-file: key.pem
  java:
    # Required: Paper rejects connections without a PROXY header.
    use-haproxy-protocol: true
  bedrock:
    broadcast-port: 0
    compression-level: 6
    # OFF (empty). The playit Bedrock (Geyser) tunnel runs with Proxy Protocol
    # None, so leave these lists empty: listing any address turns HAProxy
    # protocol on, and with relays set media is ONLY accepted with a PROXY header.
    haproxy-protocol-whitelisted-ips: []
    signaling-trusted-proxies: []
    webrtc-proxy-protocol-relays: []
    prefer-signaling-proxy-address: false
    use-waterdogpe-forwarding: false
    mtu: 1400
    validate-bedrock-login: true
    nethernet-debug: false

enable-metrics: false
debug-mode: false

# Do not change!
config-version: 12
