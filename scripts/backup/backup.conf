# trapaholics backup configuration (non-secret tunables)
# Paths are relative to REPO_ROOT unless absolute.
# Copy/edit on the host as needed; this file is safe to commit.

# Repo root. Empty = derive from this file (../.. from scripts/backup/).
REPO_ROOT=""

# Subdirectory under REPO_ROOT for local archives
BACKUP_SUBDIR="backups"

# Safety margin (bytes) added to the estimated backup size when checking free space.
# Adjusted to 1 GiB to fit current host disk headroom.
SAFETY_MARGIN_BYTES=$((1 * 1024 * 1024 * 1024))

# Multiplier applied to the newest local archive size when estimating next backup size.
BACKUP_SIZE_MULTIPLIER="1.25"

# rclone crypt remote (wraps gdrive:mc-backups). Must be gdrive-crypt: or gdrive-crypt:<subpath>
RCLONE_REMOTE="gdrive-crypt:"

# Bandwidth cap for rclone uploads (rclone --bwlimit). Empty = unlimited.
# Examples: "8M", "2M:2M"
RCLONE_BWLIMIT="8M"

# Local archives older than this many hours are eligible for the hourly offload.
# Age is derived from the UTC stamp in the filename, not mtime.
OFFLOAD_AGE_HOURS=24

# Permanently delete Drive archives this many days after verified upload.
PRUNE_AGE_DAYS=30

# Safety-net prune: delete matching remote objects older than this (days).
PRUNE_SAFETY_MIN_AGE_DAYS=31

# Consecutive offload/verify failures before Discord alert (then counter resets).
OFFLOAD_FAIL_ALERT_THRESHOLD=3

# Consecutive non-blocking offload-lock skips before Discord alert.
OFFLOAD_LOCK_SKIP_ALERT_THRESHOLD=3

# Paper containers to pause autosave on (skipped with a warning if not running).
# Single-server layout: one itzg/minecraft-server container named "minecraft".
PAPER_CONTAINERS="minecraft"

# MariaDB container and application databases to dump (space-separated).
# LuckPerms + CoreProtect by default. Each DB is dumped separately with
# --single-transaction into .backup-staging/<name>.sql.
MARIADB_CONTAINER="mariadb"
MARIADB_DATABASES="luckperms coreprotect"
# Root password is read from REPO_ROOT/.env as MARIADB_ROOT_PASSWORD (never stored here).

# Optional tar excludes: space-separated paths relative to REPO_ROOT, matched with
# tar --anchored on GNU tar. Do NOT use bare names like "data".
BACKUP_EXCLUDES="minecraft/libraries minecraft/cache minecraft/versions minecraft/logs/*.log.gz"

# Directories/files under REPO_ROOT to include in the archive (space-separated).
# The MariaDB dumps are added separately under .backup-staging/.
# Do NOT include mariadb/ (live datadir) or data/ (unused legacy).
BACKUP_INCLUDE_PATHS="minecraft geyser config scripts systemd docs docker-compose.yml .env frpc.toml relay"

# timeout(1) budgets (seconds)
DOCKER_TIMEOUT_SEC=60                 # inspect + quick rcon (save-off / save-on)
SAVE_ALL_FLUSH_TIMEOUT_SEC=300        # rcon save-all flush
MARIADB_DUMP_TIMEOUT_SEC=900          # mariadb-dump

# How long backup_ensure_space waits for the offload lock (seconds).
# Keep well under backup unit TimeoutStartSec=2h.
OFFLOAD_LOCK_WAIT_SEC=1800

# How long prune-drive waits for the offload lock (must stay well below unit TimeoutStartSec=1h).
PRUNE_LOCK_WAIT_SEC=900

# Lock and state files (under BACKUP_DIR)
LOCK_NAME=".backup.lock"
OFFLOAD_LOCK_NAME=".offload.lock"
PRUNE_LOCK_NAME=".prune.lock"
UPLOADED_LOG_NAME=".uploaded.log"
OFFLOAD_FAIL_COUNT_NAME=".offload-fail-count"
OFFLOAD_TOUCH_FAIL_COUNT_NAME=".offload-touch-fail-count"
OFFLOAD_LOCK_SKIP_COUNT_NAME=".offload-lock-skip-count"
