# trapaholics backup configuration (non-secret tunables)
# Paths are relative to REPO_ROOT unless absolute.
# Copy/edit on the host as needed; this file is safe to commit.

# Repo root. Empty = derive from this file (../.. from scripts/backup/).
REPO_ROOT=""

# Subdirectory under REPO_ROOT for local archives
BACKUP_SUBDIR="backups"

# Safety margin (bytes) added to the estimated backup size when checking free space.
# Default: 5 GiB
SAFETY_MARGIN_BYTES=$((5 * 1024 * 1024 * 1024))

# Multiplier applied to the newest local archive size when estimating next backup size.
BACKUP_SIZE_MULTIPLIER="1.25"

# rclone crypt remote (wraps gdrive:mc-backups). Never upload straight to gdrive.
RCLONE_REMOTE="gdrive-crypt:"

# Bandwidth cap for rclone uploads (rclone --bwlimit). Empty = unlimited.
# Examples: "8M", "2M:2M"
RCLONE_BWLIMIT="8M"

# Local archives older than this many hours are eligible for the hourly offload.
OFFLOAD_AGE_HOURS=24

# Permanently delete Drive archives this many days after verified upload.
PRUNE_AGE_DAYS=30

# Safety-net prune: delete anything on the remote older than this (days).
PRUNE_SAFETY_MIN_AGE_DAYS=31

# Consecutive offload/verify failures before Discord alert (then counter resets).
OFFLOAD_FAIL_ALERT_THRESHOLD=3

# Paper containers to pause autosave on (skipped with a warning if not running).
PAPER_CONTAINERS="survival creative"

# MariaDB container name and database to dump.
MARIADB_CONTAINER="mariadb"
MARIADB_DATABASE="luckperms"
# Root password is read from REPO_ROOT/.env as MARIADB_ROOT_PASSWORD (never stored here).

# Optional tar excludes (space-separated path patterns relative to each archived root).
# Paper can re-download these; they save a lot of space.
BACKUP_EXCLUDES="libraries cache versions logs/*.log.gz"

# Directories/files under REPO_ROOT to include in the archive (space-separated).
# The MariaDB dump is added separately under .backup-staging/.
# Do NOT include mariadb/ (live datadir) or data/ (unused legacy).
BACKUP_INCLUDE_PATHS="velocity survival creative config scripts docker-compose.yml .env frpc.toml relay"

# Lock and state files (under BACKUP_DIR)
LOCK_NAME=".backup.lock"
OFFLOAD_LOCK_NAME=".offload.lock"
PRUNE_LOCK_NAME=".prune.lock"
UPLOADED_LOG_NAME=".uploaded.log"
OFFLOAD_FAIL_COUNT_NAME=".offload-fail-count"
