services:
  mc:
    image: itzg/minecraft-server
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "4G"
    volumes:
      - ./data:/data
    ports:
      - "25565:25565"
    restart: unless-stopped

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    network_mode: "service:mc"
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
    restart: unless-stopped
