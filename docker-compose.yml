# trapaholics.net — Phase 1 one-server stack (ARCHITECTURE.md §3, §5, §8, §9).
#
#   playit ──(shares minecraft's netns)──► minecraft:25565 (Paper 26.3)
#              └─ Bedrock UDP 19132 ──► geyser (same netns; Geyser Standalone)
#   minecraft ──► mariadb:3306 (LuckPerms + CoreProtect; `db` network internal-only)
#
# No host ports are published: the only way in is the playit tunnel.
# Secrets come from .env (see .env.example). Every image and server/plugin
# version is pinned; never use `latest`.
#
# Data (gitignored, bind-mounted):    ./minecraft ./geyser ./mariadb
# Tracked templates (read-only):      ./config/minecraft -> synced into /data on
#                                     start (only when the template is newer than the
#                                     live file); ${CFG_*} placeholders are filled from
#                                     the environment while copying.
# Patches (read-only):                ./config/patches/minecraft -> re-applied every start.
# Source-built / CI jars (gitignored): ./plugins-built/minecraft|/geyser
#                                     (scripts/build-plugins.sh)

name: trapaholics

services:
  minecraft:
    image: itzg/minecraft-server:2026.11.0-java25
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks: [mc, db]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.3"
      PAPER_BUILD: "258"
      MEMORY: 10G
      TZ: Etc/UTC
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "FALSE"         # writes white-list=false (26.3 defaults it to true)
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?set in .env}
      MOTD: "trapaholics"
      DIFFICULTY: hard
      MODE: survival
      LEVEL: survival
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      SPAWN_PROTECTION: "0"             # spawn is protected with WorldGuard instead
      COPY_CONFIG_DEST: /data
      PATCH_DEFINITIONS: /patches
      MODRINTH_DOWNLOAD_DEPENDENCIES: none
      # LuckPerms 5.5.71, Multiverse-Core 5.8.2, Multiverse-Inventories 5.3.6 (26.3),
      # FAWE 2.16.3, FastAsyncVoxelSniper 3.2.5, WorldGuard 7.0.21, GriefPrevention 16.18.8,
      # Chunky 1.5.66. EssentialsX(+Spawn) dev, CoreProtect 25.0 (source), Floodgate come
      # from plugins-built/minecraft. spark is built into Paper. NO ViaVersion / PlotSquared /
      # regular WorldEdit / Velocity plugins.
      MODRINTH_PROJECTS: |
        luckperms:b0mk8uS6
        multiverse-core:de7TbcZG
        multiverse-inventories:86s1EwyC
        multiverse-netherportals:RRa80eDI
        fastasyncworldedit:lmHhJ4ZF
        fastasyncvoxelsniper:AnYq3r1h
        worldguard:fiHLM6oY
        griefprevention:MtwPHMAS
        chunky:RBuKjN4k
      LUCKPERMS_STORAGE_METHOD: mariadb
      LUCKPERMS_DATA_ADDRESS: mariadb:3306
      LUCKPERMS_DATA_DATABASE: luckperms
      LUCKPERMS_DATA_USERNAME: luckperms
      LUCKPERMS_DATA_PASSWORD: ${LUCKPERMS_DB_PASSWORD:?set in .env}
      CFG_COREPROTECT_DB_PASSWORD: ${COREPROTECT_DB_PASSWORD:?set in .env}
    volumes:
      - ./minecraft:/data
      - ./config/minecraft:/config:ro
      - ./config/patches/minecraft:/patches:ro
      - ./plugins-built/minecraft:/plugins:ro

  # Shares minecraft's network namespace so playit can target 127.0.0.1:19132 for Bedrock
  # and Geyser can reach Paper at 127.0.0.1:25565 (with PROXY protocol).
  geyser:
    image: eclipse-temurin:21.0.9_10-jre-alpine
    container_name: geyser
    restart: unless-stopped
    network_mode: "service:minecraft"
    depends_on:
      - minecraft
    working_dir: /data
    environment:
      TZ: Etc/UTC
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0 -Xms256M -Xmx512M"
    command:
      - java
      - -jar
      - /opt/Geyser-Standalone.jar
      - --nogui
    volumes:
      - ./geyser:/data
      - ./plugins-built/geyser/Geyser-Standalone.jar:/opt/Geyser-Standalone.jar:ro

  mariadb:
    image: mariadb:12.3.3
    container_name: mariadb
    restart: unless-stopped
    networks: [db]
    environment:
      TZ: Etc/UTC
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_AUTO_UPGRADE: "1"
      LUCKPERMS_DB_PASSWORD: ${LUCKPERMS_DB_PASSWORD:?set in .env}
      COREPROTECT_DB_PASSWORD: ${COREPROTECT_DB_PASSWORD:?set in .env}
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
      - --performance-schema=OFF
    volumes:
      - ./mariadb:/var/lib/mysql
      - ./config/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  playit:
    # >= 0.15.26 is required for PROXY protocol v2; 1.2.0 is the newest 1.x release.
    image: ghcr.io/playit-cloud/playit-agent:1.2.0
    container_name: playit
    restart: unless-stopped
    # Shares minecraft's network namespace: Java tunnel → 127.0.0.1:25565,
    # Bedrock UDP tunnel → 127.0.0.1:19132 (Geyser in the same netns).
    network_mode: "service:minecraft"
    depends_on: [minecraft, geyser]
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY:?set in .env}

networks:
  # Game traffic between minecraft and (Phase 2) frpc. Not `internal`, because
  # containers need outbound internet (Mojang auth, Paper/plugin downloads, playit).
  # No ports are published on the host.
  mc:
  # Database network: internal only (no route outside the host's Docker).
  db:
    internal: true
